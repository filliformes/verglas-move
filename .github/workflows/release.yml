name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION=$(grep -o '"version": *"[^"]*"' module.json | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match module.json version ($JSON_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Test (native)
        run: bash scripts/test.sh

      - name: Build
        run: |
          chmod +x scripts/build.sh
          CROSS_PREFIX=aarch64-linux-gnu- bash scripts/build.sh

      - name: Create tarball
        run: |
          cd modules
          tar -czf ../verglas-module.tar.gz verglas/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: verglas-module.tar.gz
          generate_release_notes: true

      - name: Update release.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          URL="https://github.com/${{ github.repository }}/releases/download/v${TAG}/verglas-module.tar.gz"

          # Commit on top of the CURRENT main, not on the tag: if main moved
          # past the tag while this ran, a commit based on the tag would be
          # rejected as a non-fast-forward and release.json would never update.
          git fetch origin main
          git checkout -f -B main origin/main

          # Never move release.json backwards (e.g. re-running an older tag).
          CURRENT=$(grep -o '"version": *"[^"]*"' release.json 2>/dev/null | grep -o '[0-9][0-9.]*' || echo "0")
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$TAG" | sort -V | tail -1)
          if [ "$NEWEST" != "$TAG" ]; then
            echo "release.json already at $CURRENT (newer than $TAG), leaving it"
            exit 0
          fi

          echo "{" > release.json
          echo "  \"version\": \"${TAG}\"," >> release.json
          echo "  \"download_url\": \"${URL}\"" >> release.json
          echo "}" >> release.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json already up to date"
            exit 0
          fi
          git commit -m "ci: update release.json for v${TAG}"
          git push origin main
